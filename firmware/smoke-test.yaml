# ScaleController Rev-A — bring-up / bench test
#
# Bench firmware for load-cell testing: Wi-Fi, Home Assistant API, OTA and a small web page,
# no display. Flash once over USB, then update over Wi-Fi from the ESPHome dashboard.
#
#   - status LED D5 (GPIO7) blinks at 1 Hz       -> firmware is running
#   - I2C scan on GPIO4/GPIO3 at boot             -> OLED at 0x3C if J9 is fitted
#   - HX711 raw counts and delta every 0.5 s      -> load-cell path
#   - "Zero" button (HA / web page) zeroes delta  -> Rev-A has no BOOT button (SW1 removed)
#   - Wi-Fi signal every 30 s
#
# Readings: Home Assistant, the device's web page (http://<device IP>/), or
# `esphome logs` / the dashboard's LOGS over Wi-Fi.
#
# The four sockets are two half-bridge pairs: LC1/LC2 (J5/J8) feed S-, LC3/LC4 (J3/J7)
# feed S+. Testing needs at least one cell in each pair.
#
# Uses the same secrets as scale-controller.yaml (see secrets.yaml.example).

esphome:
  name: scale-smoke
  friendly_name: "Scale Smoke Test"
  on_boot:
    then:
      - logger.log: "boot ok"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Scale Smoke Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

i2c:
  sda: GPIO4
  scl: GPIO3
  scan: true

globals:
  - id: zero_offset
    type: float
    initial_value: "0"
  - id: led_state
    type: bool
    initial_value: "false"

output:
  - platform: gpio
    id: status_led_out
    pin:
      number: GPIO7
      inverted: true          # D5 anode to 3.3V via R14: LOW lights it

interval:
  - interval: 500ms
    then:
      - lambda: |-
          id(led_state) = !id(led_state);
          if (id(led_state)) id(status_led_out).turn_on(); else id(status_led_out).turn_off();

sensor:
  - platform: hx711
    id: hx711_raw
    name: "HX711 Raw"
    dout_pin: GPIO6
    clk_pin: GPIO5
    gain: 128
    update_interval: 500ms

  - platform: template
    name: "HX711 Delta"
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      return id(hx711_raw).state - id(zero_offset);

  - platform: internal_temperature
    name: "Chip Temperature"
    update_interval: 10s

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 30s

button:
  - platform: template
    name: "Zero"
    on_press:
      then:
        - lambda: 'id(zero_offset) = id(hx711_raw).state;'
        - logger.log: "zeroed"

  - platform: restart
    name: "Restart"
