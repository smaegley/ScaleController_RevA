# Scale Controller — ESPHome configuration
#
# Board: Scale Controller Rev-A (ESP32-C3 + HX711, four half-bridge load cells).
# Behaviour and Home Assistant entities: docs/firmware-spec.md.
#
# First flash over USB (native USB-Serial/JTAG on the USB-C port), then over Wi-Fi.
# Copy secrets.yaml.example to secrets.yaml and fill in your values before building.
#
# Calibrate from Home Assistant (no recompile):
#   1. Empty scale -> press "Zero".
#   2. Put a known mass on it, enter it in "Calibration weight", press "Calibrate".
#   "Status" shows progress; the result is saved on the device.

substitutions:
  name: scale-controller
  friendly_name: "Scale Controller"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

external_components:
  - source:
      type: local
      path: components

packages:
  board: !include packages/board-rev-a.yaml
  scale: !include packages/scale-core.yaml

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:
